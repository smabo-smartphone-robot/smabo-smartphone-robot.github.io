plugins:
  - jekyll-sitemap

# 作業用の Markdown・テンプレートは公開しない
exclude:
  - "*.md"
  - architecture/architecture_template.html
  - assembly_movie/assembly-viewer-template.html

# 組み立てビューア（ガイドに iframe で埋め込み）は単体で sitemap に載せない
defaults:
  - scope:
      path: "assembly_movie"
    values:
      sitemap: false
